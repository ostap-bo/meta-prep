<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meta Ads: підготовка Остапа</title>
<meta name="description" content="Тренажер до технічної співбесіди на Account Manager (Meta Ads): словник, формули, кабінет, кейси, тести й картки.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%98%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: Notion-style workspace — fixed left sidebar with page tree, topbar with breadcrumb, centered 760px page column, side "peek" panel for database rows */
:root{
  --bg:#ffffff; --side:#f7f7f5; --fg:#37352f; --muted:#787774; --faint:#a5a29c; --line:#e9e9e7; --hover:rgba(55,53,47,.06); --active:rgba(55,53,47,.09);
  --accent:#2383e2; --accent-bg:#e7f2fb; --on-accent:#ffffff;
  --t-gray:#787774; --t-gray-bg:#f1f1ef; --t-brown:#9f6b53; --t-brown-bg:#f4eeee; --t-orange:#d9730d; --t-orange-bg:#fbecdd;
  --t-yellow:#cb912f; --t-yellow-bg:#fbf3db; --t-green:#448361; --t-green-bg:#edf3ec; --t-blue:#337ea9; --t-blue-bg:#e7f3f8;
  --t-purple:#9065b0; --t-purple-bg:#f6f3f9; --t-pink:#c14c8a; --t-pink-bg:#faf1f5; --t-red:#d44c47; --t-red-bg:#fdebec;
  --shadow:0 0 0 1px rgba(15,15,15,.05),0 3px 6px rgba(15,15,15,.1),0 9px 24px rgba(15,15,15,.2);
  --f-body:"Inter",ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#191919; --side:#202020; --fg:#d4d4d4; --muted:#9b9b9b; --faint:#6f6f6f; --line:#2f2f2f; --hover:rgba(255,255,255,.055); --active:rgba(255,255,255,.09);
  --accent:#529cca; --accent-bg:#1f2f3c; --on-accent:#0f1316;
  --t-gray:#9b9b9b; --t-gray-bg:#2f2f2f; --t-brown:#ba856f; --t-brown-bg:#4a3228; --t-orange:#c77d48; --t-orange-bg:#5c3b23;
  --t-yellow:#ca9849; --t-yellow-bg:#564328; --t-green:#529e72; --t-green-bg:#243d30; --t-blue:#5e87c9; --t-blue-bg:#143a4e;
  --t-purple:#9d68d3; --t-purple-bg:#3c2d49; --t-pink:#d15796; --t-pink-bg:#4e2c3c; --t-red:#df5452; --t-red-bg:#522e2a;
  --shadow:0 0 0 1px rgba(255,255,255,.07),0 3px 6px rgba(0,0,0,.3),0 9px 24px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191919; --side:#202020; --fg:#d4d4d4; --muted:#9b9b9b; --faint:#6f6f6f; --line:#2f2f2f; --hover:rgba(255,255,255,.055); --active:rgba(255,255,255,.09);
  --accent:#529cca; --accent-bg:#1f2f3c; --on-accent:#0f1316;
  --t-gray:#9b9b9b; --t-gray-bg:#2f2f2f; --t-brown:#ba856f; --t-brown-bg:#4a3228; --t-orange:#c77d48; --t-orange-bg:#5c3b23;
  --t-yellow:#ca9849; --t-yellow-bg:#564328; --t-green:#529e72; --t-green-bg:#243d30; --t-blue:#5e87c9; --t-blue-bg:#143a4e;
  --t-purple:#9d68d3; --t-purple-bg:#3c2d49; --t-pink:#d15796; --t-pink-bg:#4e2c3c; --t-red:#df5452; --t-red-bg:#522e2a;
  --shadow:0 0 0 1px rgba(255,255,255,.07),0 3px 6px rgba(0,0,0,.3),0 9px 24px rgba(0,0,0,.45);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit;text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}

/* ---------- app shell ---------- */
.app{display:flex;min-height:100%}
.side{position:fixed;inset:0 auto 0 0;width:260px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30;padding-top:env(safe-area-inset-top,0px);transition:transform .2s ease}
.ws{display:flex;align-items:center;gap:8px;padding:12px 14px 6px;font-weight:600;font-size:14px}
.ws .av{width:22px;height:22px;border-radius:4px;background:var(--t-blue-bg);color:var(--t-blue);display:grid;place-items:center;font-size:12px;font-weight:700}
.ws small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.side-btn{display:flex;align-items:center;gap:8px;width:calc(100% - 12px);margin:0 6px;padding:5px 10px;border:0;background:transparent;border-radius:6px;text-align:left;font-size:14px;color:var(--muted);cursor:pointer}
.side-btn:hover{background:var(--hover)}
.side-btn kbd{margin-left:auto;font-family:var(--f-body);font-size:11px;color:var(--faint)}
.side-scroll{overflow-y:auto;flex:1;padding:6px 0 16px}
.grp{font-size:12px;font-weight:600;color:var(--faint);padding:14px 16px 4px}
.pg{display:flex;align-items:center;gap:8px;width:calc(100% - 12px);margin:0 6px;padding:4px 10px;border:0;background:transparent;border-radius:6px;text-align:left;font-size:14px;cursor:pointer;color:var(--fg)}
.pg:hover{background:var(--hover)}
.pg[aria-current="page"]{background:var(--active);font-weight:600}
.pg .ic{width:20px;text-align:center;flex:0 0 auto}
.pg .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg .dn{font-size:11px;color:var(--t-green);flex:0 0 auto}
.side-foot{border-top:1px solid var(--line);padding:10px 14px 14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.meter{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--t-green);width:0;transition:width .3s}
.scrim{display:none}
.mainc{flex:1;min-width:0;margin-left:260px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:6px;height:46px;padding:0 12px;padding-top:env(safe-area-inset-top,0px);box-sizing:content-box}
.top .crumb{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--fg);min-width:0}
.top .crumb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .crumb .sep{color:var(--faint)}
.top .sp{flex:1}
.ibtn{border:0;background:transparent;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;height:30px}
.ibtn:hover{background:var(--hover)}
#menuBtn{display:none}
.page{max-width:760px;margin:0 auto;padding-inline:max(16px,4vw);padding-block:28px 120px}
@media (max-width:900px){
  .side{transform:translateX(-100%);box-shadow:var(--shadow)}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(15,15,15,.35);z-index:25}
  .mainc{margin-left:0}
  #menuBtn{display:inline-flex}
}

/* ---------- page header ---------- */
.p-icon{font-size:64px;line-height:1;margin-bottom:8px}
.p-title{font-size:clamp(28px,5vw,40px);font-weight:700;line-height:1.2;margin:0 0 10px;letter-spacing:-.01em;text-wrap:balance}
.props{display:flex;flex-direction:column;gap:2px;margin:6px 0 18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.prop{display:flex;gap:8px;align-items:center;font-size:14px;min-height:30px}
.prop .k{width:140px;flex:0 0 auto;color:var(--muted);display:flex;gap:6px;align-items:center}
.prop .v{min-width:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.donebtn{border:1px solid var(--line);background:transparent;border-radius:6px;padding:2px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.donebtn[aria-pressed="true"]{background:var(--t-green-bg);color:var(--t-green);border-color:transparent}

/* ---------- blocks ---------- */
.blocks{display:flex;flex-direction:column;gap:6px}
.blocks>*{margin:0}
h2.b{font-size:24px;font-weight:600;margin:22px 0 4px;line-height:1.3}
h3.b{font-size:19px;font-weight:600;margin:14px 0 2px;line-height:1.35}
p{margin:0;max-width:70ch}
.muted{color:var(--muted)}
.lead{color:var(--muted)}
ul,ol{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:3px}
li::marker{color:var(--fg)}
hr{border:0;border-top:1px solid var(--line);margin:10px 0;width:100%}
code,.mono{font-family:var(--f-mono);font-size:.87em}
code{background:var(--t-gray-bg);color:var(--t-red);padding:1px 5px;border-radius:4px}
.callout{display:flex;gap:10px;padding:14px 16px;border-radius:6px;background:var(--t-gray-bg);font-size:15px}
.callout .ci{font-size:20px;line-height:1.3;flex:0 0 auto}
.callout>div{min-width:0;display:flex;flex-direction:column;gap:6px}
.callout.blue{background:var(--t-blue-bg)} .callout.yellow{background:var(--t-yellow-bg)} .callout.green{background:var(--t-green-bg)} .callout.red{background:var(--t-red-bg)} .callout.purple{background:var(--t-purple-bg)}
.quote{border-left:3px solid var(--fg);padding:2px 0 2px 14px;font-size:17px}
.tag{display:inline-flex;align-items:center;font-size:12.5px;line-height:1.5;padding:0 7px;border-radius:4px;background:var(--t-gray-bg);color:var(--fg);white-space:nowrap}
.tag.blue{background:var(--t-blue-bg)} .tag.green{background:var(--t-green-bg)} .tag.yellow{background:var(--t-yellow-bg)} .tag.red{background:var(--t-red-bg)} .tag.purple{background:var(--t-purple-bg)} .tag.orange{background:var(--t-orange-bg)} .tag.pink{background:var(--t-pink-bg)} .tag.brown{background:var(--t-brown-bg)}
/* toggle */
details.tg{border-radius:4px}
details.tg>summary{list-style:none;cursor:pointer;display:flex;gap:6px;align-items:flex-start;padding:3px 2px;border-radius:4px}
details.tg>summary::-webkit-details-marker{display:none}
details.tg>summary:hover{background:var(--hover)}
details.tg>summary::before{content:"";flex:0 0 auto;width:0;height:0;margin:7px 6px 0 6px;border-left:6px solid var(--fg);border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;transition:transform .15s}
details.tg[open]>summary::before{transform:rotate(90deg)}
details.tg>summary .sm{font-weight:500;flex:1;min-width:0}
details.tg>.tb{padding:4px 0 8px 26px;display:flex;flex-direction:column;gap:6px}
/* to-do */
.todo{display:flex;gap:10px;align-items:flex-start;padding:3px 2px;border-radius:4px;cursor:pointer}
.todo:hover{background:var(--hover)}
.todo input{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:1.5px solid var(--fg);border-radius:3px;margin:4px 0 0;flex:0 0 auto;display:grid;place-items:center;cursor:pointer;background:transparent}
.todo input:checked{background:var(--accent);border-color:var(--accent)}
.todo input:checked::after{content:"";width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.todo input:checked+span{color:var(--faint);text-decoration:line-through}
.todo .tm{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-right:6px}
/* columns */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.box{border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--bg)}
.box h4{margin:0;font-size:15px;font-weight:600}
/* db table */
.db-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:6px;margin-top:8px}
.view{border:0;background:transparent;font-size:14px;padding:4px 8px;border-radius:6px;cursor:pointer;color:var(--muted)}
.view[aria-pressed="true"]{color:var(--fg);font-weight:600;box-shadow:inset 0 -2px 0 var(--fg);border-radius:0}
.view:hover{background:var(--hover)}
.db-bar .sp{flex:1}
.db-search{border:0;background:var(--hover);border-radius:6px;padding:5px 10px;font:inherit;font-size:14px;color:var(--fg);width:200px;max-width:100%}
.filter{border:1px solid var(--line);background:transparent;font-size:13px;padding:2px 9px;border-radius:999px;cursor:pointer;color:var(--muted)}
.filter[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent);border-color:transparent}
.tbl{overflow-x:auto;width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:13px;white-space:nowrap}
th+th,td+td{border-left:1px solid var(--line)}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.dbrow{cursor:pointer}
tr.dbrow:hover td{background:var(--hover)}
.open-hint{opacity:0;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;background:var(--bg)}
tr.dbrow:hover .open-hint{opacity:1}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:10px}
.gcard{border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;background:var(--bg);text-align:left}
.gcard:hover{background:var(--hover)}
.gcard b{font-size:15px}
.gcard p{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.db-count{font-size:12px;color:var(--faint);padding:6px 2px}
/* peek */
.peek{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bg);box-shadow:var(--shadow);z-index:40;transform:translateX(105%);transition:transform .2s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.peek.on{transform:none}
.peek-top{display:flex;gap:4px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.peek-body{overflow-y:auto;padding:24px 28px 60px;display:flex;flex-direction:column;gap:12px}
.peek-body h1{margin:0;font-size:30px;line-height:1.2}
.fx{font-family:var(--f-mono);font-size:14px;background:var(--t-gray-bg);padding:10px 12px;border-radius:6px;overflow-x:auto}
/* forms */
.inp{font:inherit;font-size:15px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);width:100%}
.lbl{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 12px;font-size:14px;cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
.btn.pri:hover{filter:brightness(1.07)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpi{border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.kpi small{display:block;font-size:12px;color:var(--muted)}
.kpi b{font-family:var(--f-mono);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi span{display:block;font-size:11.5px;color:var(--faint)}
/* hierarchy */
.tree{display:flex;flex-direction:column;gap:4px;font-size:15px}
.tree div{display:flex;gap:8px;align-items:baseline}
.tree .tl{font-family:var(--f-mono);color:var(--faint);white-space:pre;flex:0 0 auto}
.tree small{color:var(--muted)}
/* funnel */
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px}
.flow .st{border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.flow .ar{color:var(--faint)}
/* quiz */
.qcard{border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:8px}
.q-opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);font-size:15px;padding:9px 12px;border-radius:6px;cursor:pointer}
.q-opt:hover{background:var(--hover)}
.q-opt.right{background:var(--t-green-bg);border-color:var(--t-green)}
.q-opt.wrong{background:var(--t-red-bg);border-color:var(--t-red)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.big{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}
/* flashcards */
.fc-wrap{perspective:1200px}
.fc{position:relative;min-height:250px;cursor:pointer;transform-style:preserve-3d;transition:transform .45s}
.fc.flip{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:center;box-shadow:0 1px 3px rgba(15,15,15,.06)}
.fc-face.back{transform:rotateY(180deg);text-align:left;justify-content:flex-start;overflow:auto}
.fc-face .ft{font-size:clamp(22px,5vw,30px);font-weight:700}
.fc-face small{color:var(--muted)}
.fb{font-weight:600}
.fb.ok{color:var(--t-green)} .fb.no{color:var(--t-red)}
/* nav footer */
.pn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:40px}
.pn button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:10px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.pn button:hover{background:var(--hover)}
.pn button small{color:var(--muted);font-size:12px}
.pn button.nx{text-align:right;grid-column:2}
/* quick find */
.qf{position:fixed;inset:0;z-index:50;display:none;align-items:flex-start;justify-content:center;background:rgba(15,15,15,.4);padding:12vh 16px 16px}
.qf.on{display:flex}
.qf-box{width:min(620px,100%);background:var(--bg);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;max-height:70vh}
.qf-box input{border:0;border-bottom:1px solid var(--line);padding:14px 18px;font:inherit;font-size:17px;background:transparent;color:var(--fg);outline:none}
.qf-list{overflow-y:auto;padding:6px}
.qf-it{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:14px}
.qf-it[aria-selected="true"],.qf-it:hover{background:var(--hover)}
.qf-it small{color:var(--muted);margin-left:auto;font-size:12px;flex:0 0 auto}
.qf-it .ttl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qf-empty{padding:16px;color:var(--muted);font-size:14px}
.say{background:var(--t-blue-bg);border-radius:6px;padding:10px 14px;font-size:15px}
footer.ft{margin-top:30px;color:var(--faint);font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:560px){.prop .k{width:110px}.pn{grid-template-columns:1fr}.pn button.nx{grid-column:1}.peek-body{padding:20px 18px 60px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Сторінки">
    <div class="ws"><div class="av">О</div><div>Підготовка Остапа<small>Account Manager · Meta Ads</small></div></div>
    <button class="side-btn" id="qfBtn" type="button">🔍 Пошук <kbd>Ctrl K</kbd></button>
    <div class="side-scroll" id="tree"></div>
    <div class="side-foot"><div>Пройдено сторінок: <b id="doneN">0</b> з <span id="doneT">0</span></div><div class="meter"><i id="doneBar"></i></div></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="mainc">
    <header class="top">
      <button class="ibtn" id="menuBtn" type="button" aria-label="Меню">☰</button>

<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem("mp_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("mp_"+k,JSON.stringify(v))}catch(e){}}};
const fmt=(n,d=2)=>isFinite(n)?Number(n).toLocaleString("uk-UA",{minimumFractionDigits:d,maximumFractionDigits:d}):"—";
const usd=(n,d=2)=>isFinite(n)?"$"+fmt(n,d):"—";
const pct=(n,d=2)=>isFinite(n)?fmt(n,d)+"%":"—";

/* ---------- DATA: glossary ---------- */
const CATS={metric:"Метрики",cab:"Кабінет Meta",track:"Трекінг",agency:"Агентські акаунти",biz:"Бізнес і клієнти"};
const GL=[
 {t:"Spend / Amount spent",ua:"Витрати, спенд",c:"metric",s:"Скільки грошей реклама вже витратила за період. Для агентства це головна цифра: від спенду залежить дохід компанії.",ex:"Клієнт за тиждень витратив $12 400, тобто його тижневий спенд $12 400."},
 {t:"Impressions",ua:"Покази",c:"metric",s:"Скільки разів оголошення показали на екрані. Одна людина може побачити рекламу кілька разів, і кожен раз рахується.",ex:"1 людина побачила оголошення 3 рази = 3 покази."},
 {t:"Reach",ua:"Охоплення",c:"metric",s:"Скільки унікальних людей побачили рекламу хоча б раз.",ex:"300 000 показів, 100 000 людей → охоплення 100 000."},
 {t:"Frequency",ua:"Частота",c:"metric",s:"Скільки разів у середньому одна людина бачила рекламу. Висока частота на холодній аудиторії означає, що людям набридло оголошення.",f:"Frequency = Impressions ÷ Reach",ex:"300 000 ÷ 100 000 = 3. Якщо за тиждень частота росте понад 3–4, а CTR падає, оголошення «вигорає»."},
 {t:"CPM",ua:"Ціна за 1000 показів",c:"metric",s:"Скільки коштує показати рекламу 1000 разів. Залежить від конкуренції за аудиторію, країни, сезону і якості оголошення.",f:"CPM = Spend ÷ Impressions × 1000",ex:"$500 ÷ 50 000 × 1000 = $10. У США і Західній Європі CPM вищий, ніж в Азії чи Латинській Америці. Перед Black Friday і Різдвом CPM росте."},
 {t:"Clicks (all)",ua:"Усі кліки",c:"metric",s:"Будь-які кліки по оголошенню: на профіль, лайки, розгортання тексту, перегляд фото. Не тільки переходи на сайт.",ex:"Тому для реклами на сайт дивляться не «всі кліки», а Link clicks."},
 {t:"Link clicks",ua:"Кліки за посиланням",c:"metric",s:"Кліки, які ведуть людину за посиланням: на сайт, у застосунок, на форму.",ex:"Головний клік для трафікових і конверсійних кампаній."},
 {t:"CTR",ua:"Клікабельність",c:"metric",s:"Який відсоток людей, що побачили рекламу, клікнули. Показує, наскільки оголошення чіпляє. У Meta є CTR (all) і CTR (link click-through rate); для аналізу беруть link CTR.",f:"CTR = Clicks ÷ Impressions × 100%",ex:"500 кліків ÷ 50 000 показів = 1%. Орієнтир для link CTR: близько 1% і вище — нормально, нижче 0,5% — креатив слабкий (залежить від ніші)."},
 {t:"CPC",ua:"Ціна за клік",c:"metric",s:"Скільки в середньому коштує один клік.",f:"CPC = Spend ÷ Clicks",ex:"$500 ÷ 500 = $1. Зв'язок: CPC = CPM ÷ (CTR × 10). Якщо CPM $10 і CTR 1%, CPC = $1."},
 {t:"Landing page views",ua:"Перегляди цільової сторінки",c:"metric",s:"Скільки людей після кліку реально дочекались завантаження сайту. Якщо кліків багато, а переглядів сторінки мало, сайт повільний або є технічна проблема.",ex:"1000 link clicks і лише 550 LPV — сайт довго вантажиться."},
 {t:"Results / Conversions",ua:"Результати, конверсії",c:"metric",s:"Цільова дія, на яку налаштована кампанія: покупка, лід (заявка), реєстрація, встановлення застосунку.",ex:"Для інтернет-магазину результат — Purchase, для школи — Lead."},
 {t:"CR (Conversion rate)",ua:"Конверсія",c:"metric",s:"Який відсоток людей, що перейшли на сайт, зробили цільову дію. Показує якість сайту й оферу, а не реклами.",f:"CR = Conversions ÷ Clicks × 100%",ex:"20 покупок ÷ 1000 кліків = 2%. Для e-commerce 1–3% — типово."},
 {t:"CPA / Cost per result",ua:"Ціна за дію (результат)",c:"metric",s:"Скільки коштує одна цільова дія: покупка, лід, реєстрація. Головна метрика для більшості performance-клієнтів. Різновиди: CPL (за лід), CPI (за встановлення), CPP (за покупку).",f:"CPA = Spend ÷ Conversions",ex:"$1000 ÷ 40 лідів = $25 за лід."},
 {t:"ROAS",ua:"Окупність рекламних витрат",c:"metric",s:"Скільки виручки приносить кожен долар, вкладений у рекламу. Рахується від виручки, а не від прибутку.",f:"ROAS = Revenue ÷ Spend",ex:"Витратили $2000, отримали $6000 виручки → ROAS = 3 (або 300%). Кожен $1 приніс $3."},
 {t:"ROI",ua:"Окупність інвестицій",c:"metric",s:"Скільки чистого прибутку приніс вкладений долар з урахуванням усіх витрат (собівартість, доставка, комісії). ROI буває від'ємним, коли ви в мінусі.",f:"ROI = (Прибуток − Витрати) ÷ Витрати × 100%",ex:"Витрати $2000, прибуток (після собівартості) $2600 → ROI = (2600 − 2000) ÷ 2000 = 30%."},
 {t:"Break-even ROAS",ua:"ROAS беззбитковості",c:"metric",s:"Мінімальний ROAS, при якому клієнт виходить у нуль. Залежить від маржі продукту.",f:"Break-even ROAS = 1 ÷ Маржа",ex:"Маржа 40% → 1 ÷ 0,4 = 2,5. Якщо ROAS нижче 2,5, клієнт втрачає гроші, навіть якщо ROAS здається «непоганим»."},
 {t:"AOV",ua:"Середній чек",c:"metric",s:"Середня сума однієї покупки.",f:"AOV = Revenue ÷ Purchases",ex:"$6000 ÷ 60 покупок = $100."},
 {t:"LTV",ua:"Цінність клієнта за весь час",c:"metric",s:"Скільки грошей клієнт приносить за весь час, а не лише з першої покупки. Через LTV бізнес може дозволити собі дорожчий CPA.",ex:"Підписка $30/міс, клієнт у середньому платить 6 місяців → LTV $180. Тоді CPA $60 — вигідно."},
 {t:"CAC",ua:"Вартість залучення клієнта",c:"metric",s:"Скільки в сумі коштує залучити одного платного клієнта з урахуванням усіх витрат на маркетинг і продажі, не лише реклами.",ex:"Схоже на CPA, але ширше: включає зарплати, сервіси, знижки."},
 {t:"Hook rate",ua:"Утримання з перших секунд",c:"metric",s:"Яка частка людей подивилась перші 3 секунди відео. Показує, чи зупиняє креатив скрол.",f:"Hook rate = 3-sec video plays ÷ Impressions × 100%",ex:"Понад 25–30% — сильний «гачок» (орієнтир)."},
 {t:"Business Manager / Business portfolio",ua:"Бізнес-менеджер (Meta Business Suite)",c:"cab",s:"«Головна папка» компанії в Meta. В ній живуть рекламні акаунти, сторінки Facebook, Instagram-акаунти, пікселі, люди та їхні доступи. Зараз Meta називає це «Business portfolio».",ex:"Агентство може видати клієнту рекламний акаунт у своєму БМ або «пошерити» його в БМ клієнта."},
 {t:"Ad account",ua:"Рекламний акаунт (кабінет)",c:"cab",s:"Місце, де створюються кампанії і з якого списуються гроші. У нього є валюта, часовий пояс, спосіб оплати, ліміт витрат і статус (активний, заблокований).",ex:"Валюту й часовий пояс акаунта після створення змінити не можна, тільки створити новий."},
 {t:"Campaign",ua:"Кампанія",c:"cab",s:"Верхній рівень реклами. Тут обирається ціль (objective) і, за бажанням, бюджет на всю кампанію (Advantage campaign budget).",ex:"Кампанія «Продажі — Польща — жовтень» з ціллю Sales."},
 {t:"Ad set",ua:"Група оголошень",c:"cab",s:"Середній рівень. Тут налаштовують, КОМУ, ДЕ і ЯК показувати: аудиторія, гео, плейсменти, бюджет (якщо не на рівні кампанії), подія оптимізації, розклад, стратегія ставок.",ex:"Ad set «Жінки 25–45, PL, Advantage+ audience, оптимізація на Purchase»."},
 {t:"Ad",ua:"Оголошення",c:"cab",s:"Нижній рівень: те, що бачить людина. Картинка чи відео, текст, заголовок, кнопка (CTA), посилання, UTM-мітки.",ex:"Одне відео 15 сек + текст + кнопка «Купити»."},
 {t:"Objective",ua:"Ціль кампанії",c:"cab",s:"Що Meta має шукати для вас. Зараз їх 6: Awareness (впізнаваність), Traffic (трафік), Engagement (взаємодія), Leads (ліди), App promotion (застосунок), Sales (продажі). Алгоритм показує рекламу тим, хто найімовірніше зробить саме цю дію.",ex:"Інтернет-магазину з бюджетом $10k+ майже завжди потрібна ціль Sales з оптимізацією на Purchase."},
 {t:"CBO / Advantage campaign budget",ua:"Бюджет на рівні кампанії",c:"cab",s:"Бюджет задається на кампанію, і Meta сама розподіляє гроші між групами оголошень туди, де результат дешевший. Протилежність — ABO, коли бюджет задається на кожну групу окремо.",ex:"ABO зручно для тестів (контролюєш гроші на кожну аудиторію), CBO — для масштабування."},
 {t:"Daily / Lifetime budget",ua:"Денний / загальний бюджет",c:"cab",s:"Денний — скільки в середньому витрачати за день (у конкретний день Meta може витратити до 75% більше, але за тиждень не більше 7× денного). Lifetime — сума на весь період кампанії.",ex:"Денний $500 → у сильний день може бути $875, але за 7 днів максимум $3500."},
 {t:"Bid strategy",ua:"Стратегія ставок",c:"cab",s:"Як Meta торгується на аукціоні. Highest volume (найбільше результатів за бюджет, за замовчуванням), Cost per result goal (тримати середню ціну результату), ROAS goal (тримати окупність), Bid cap (максимальна ставка на аукціоні).",ex:"Для старту — Highest volume. Cost cap/bid cap — коли треба жорстко контролювати CPA при масштабуванні."},
 {t:"Learning phase",ua:"Фаза навчання",c:"cab",s:"Період, коли алгоритм вчиться, кому показувати рекламу. Щоб вийти з неї, групі потрібно приблизно 50 подій оптимізації за 7 днів. У цей час результати нестабільні, і різкі зміни краще не робити.",ex:"Статус «Learning limited» — група не набирає 50 подій: замалий бюджет, вузька аудиторія або занадто «важка» подія."},
 {t:"Significant edit",ua:"Суттєва зміна",c:"cab",s:"Зміна, яка перезапускає фазу навчання: нова аудиторія, новий креатив, зміна події оптимізації чи стратегії ставок, різка зміна бюджету, пауза на 7+ днів.",ex:"Тому бюджет часто піднімають поступово, приблизно на 20% за раз, а не вдвічі одразу."},
 {t:"Audience: Broad / Custom / Lookalike",ua:"Аудиторії",c:"cab",s:"Broad — широка аудиторія (тільки гео, вік, стать), алгоритм сам шукає покупців. Custom — ваші люди: відвідувачі сайту, покупці, база email. Lookalike — люди, схожі на вашу Custom-аудиторію. Advantage+ audience — режим, де Meta сама розширює таргетинг.",ex:"Ретаргетинг: Custom «відвідали сайт за 30 днів, але не купили»."},
 {t:"Placements",ua:"Плейсменти",c:"cab",s:"Де показується реклама: стрічка Facebook/Instagram, Stories, Reels, Messenger, Audience Network. Advantage+ placements — Meta сама обирає, де дешевше.",ex:"У розбивці (breakdown) по плейсментах видно, що Reels дає найнижчий CPA."},
 {t:"Breakdown",ua:"Розбивка звіту",c:"cab",s:"Кнопка в Ads Manager, яка ділить статистику за віком, статтю, країною, плейсментом, пристроєм, часом. Головний інструмент, щоб знайти, ЩО саме працює або тягне вниз.",ex:"Breakdown → Delivery → Age: вік 18–24 з'їдає 30% бюджету і не купує."},
 {t:"Delivery status",ua:"Статус показу",c:"cab",s:"Колонка Delivery в Ads Manager: Active (крутиться), Learning (навчається), Learning limited, In review (на модерації), Rejected (відхилено), Not delivering (не показується), Off, Completed.",ex:"«Not delivering» часто означає: закінчився бюджет, ліміт витрат акаунта або проблема з оплатою."},
 {t:"Ad review / Rejected",ua:"Модерація / відхилено",c:"cab",s:"Кожне оголошення перевіряє Meta на відповідність правилам (Advertising Standards). Відхилене оголошення можна виправити або подати на повторну перевірку (Request review).",ex:"Типові причини: обіцянки «гарантовано схуднете», фото «до/після», особисті атрибути («Ви маєте борги?»)."},
 {t:"Account Quality / Account status",ua:"Якість і статус акаунта",c:"cab",s:"Розділ, де видно обмеження: заблоковані акаунти, сторінки, БМ, відхилені оголошення, і де подається апеляція (Request review).",ex:"Перше місце, куди дивитись, коли клієнт пише «у мене все впало»."},
 {t:"Spending limit",ua:"Ліміт витрат",c:"cab",s:"Максимальна сума, яку може витратити акаунт. Коли ліміт досягнуто, реклама зупиняється. Буває ліміт, який ставить власник, і ліміт, який ставить сама Meta для нових акаунтів (daily spending limit).",ex:"Агентські акаунти цінують саме за високі ліміти: можна одразу витрачати тисячі доларів на день."},
 {t:"Billing / Payment method",ua:"Оплата",c:"cab",s:"Як акаунт платить за рекламу: карткою з порогом списання (billing threshold), передплатою (prepaid) або через кредитну лінію агентства. Проблема з оплатою = реклама зупиняється.",ex:"В агентському акаунті клієнт поповнює баланс через агентство, а не своєю карткою."},
 {t:"Special ad categories",ua:"Особливі категорії",c:"cab",s:"Кредити й фінанси, працевлаштування, житло, соціальні та політичні теми. Для них таргетинг обмежений (не можна звужувати вік, стать тощо), і це треба вказати при створенні кампанії.",ex:"Реклама кредитів без позначки Special ad category → відхилення і ризик блокування."},
 {t:"Ads Library",ua:"Бібліотека реклами",c:"cab",s:"Публічна база всіх активних оголошень у Meta. Можна подивитись рекламу будь-якого конкурента.",ex:"Перед зустріччю з новим клієнтом можна глянути, що він зараз крутить."},
 {t:"Meta Pixel",ua:"Піксель",c:"track",s:"Шматок коду на сайті, який передає в Meta, що люди роблять після кліку: переглянули товар, додали в кошик, купили. Без пікселя алгоритм «сліпий».",ex:"Немає пікселя на сторінці «Дякуємо за покупку» → Meta не бачить покупок і не може оптимізуватись."},
 {t:"Conversions API (CAPI)",ua:"API конверсій",c:"track",s:"Передача подій напряму з сервера сайту в Meta, а не тільки через браузер. Додає дані, які втрачаються через блокувальники реклами й iOS. Працює разом з пікселем; дублікати прибирає дедуплікація за event_id.",ex:"Після підключення CAPI Meta бачить більше покупок і краще оптимізує."},
 {t:"Events Manager / Standard events",ua:"Менеджер подій",c:"track",s:"Розділ, де видно всі події з пікселя й CAPI. Стандартні події: PageView, ViewContent, AddToCart, InitiateCheckout, Purchase, Lead, CompleteRegistration.",ex:"Якщо Purchase у Events Manager раптом впав до нуля — найімовірніше, зламався піксель, а не реклама."},
 {t:"Event Match Quality",ua:"Якість зіставлення подій",c:"track",s:"Оцінка від 0 до 10, наскільки добре Meta може «впізнати» людину з події (email, телефон тощо). Чим вище, тим краща оптимізація.",ex:"EMQ 4/10 → варто передавати більше даних через CAPI."},
 {t:"Attribution setting",ua:"Вікно атрибуції",c:"track",s:"За який період після кліку чи перегляду Meta зараховує конверсію рекламі. За замовчуванням: 7 днів після кліку і 1 день після перегляду.",ex:"Тому цифри в Meta і в Google Analytics клієнта майже ніколи не збігаються, і це нормально."},

 <div class="callout blue"><span class="ci">🔗</span><div><p><b>Ланцюжок напам'ять:</b> <span class="mono">CPA = CPC ÷ CR</span>, а <span class="mono">CPC = CPM ÷ (CTR × 10)</span>. CPA залежить від трьох речей: ціни аукціону (CPM), креативу (CTR) і сайту (CR). Коли CPA росте — шукайте, яка з трьох зламалась.</p></div></div>

function calc(){
 const v=id=>parseFloat($("#"+id).value)||0;
 const sp=v("c-sp"),im=v("c-im"),re=v("c-re"),cl=v("c-cl"),cv=v("c-cv"),rv=v("c-rv"),mg=v("c-mg")/100;
 const cpm=sp/im*1000,ctr=cl/im*100,cpc=sp/cl,cr=cv/cl*100,cpa=sp/cv,roas=rv/sp,fr=im/re,aov=rv/cv,be=1/mg,profit=rv*mg-sp,roi=profit/sp*100;
 const k=[["CPM",usd(cpm),"ціна 1000 показів"],["CTR",pct(ctr),"клікабельність"],["CPC",usd(cpc),"ціна кліку"],["CR",pct(cr),"конверсія сайту"],["CPA",usd(cpa),"ціна результату"],["ROAS",fmt(roas),"виручка / спенд"],["Frequency",fmt(fr),"покази / охоплення"],["AOV",usd(aov),"середній чек"],["Break-even ROAS",fmt(be),"при маржі "+Math.round(mg*100)+"%"],["ROI",pct(roi,1),"прибуток "+usd(profit,0)]];
 $("#c-out").innerHTML=k.map(x=>`<div class="kpi"><small>${x[0]}</small><b>${x[1]}</b><span>${x[2]}</span></div>`).join("");
 let vd="";
 if(isFinite(roas)&&isFinite(be)) vd= roas>=be?`<div class="callout green"><span class="ci">✅</span><div><p>ROAS ${fmt(roas)} вище точки беззбитковості ${fmt(be)} — клієнт у плюсі, можна обережно масштабувати.</p></div></div>`:`<div class="callout red"><span class="ci">⛔</span><div><p>ROAS ${fmt(roas)} нижче точки беззбитковості ${fmt(be)} — клієнт у мінусі. Спочатку виправити CPA, потім масштабувати.</p></div></div>`;
 if(fr>4) vd+=`<div class="callout yellow"><span class="ci">🔥</span><div><p>Частота ${fmt(fr)} — ризик вигорання креативу.</p></div></div>`;
 $("#c-verdict").innerHTML=vd;
}

function genDrill(){
 const r=(a,b,s=1)=>Math.round((a+Math.random()*(b-a))/s)*s;
 const sp=r(500,20000,50),im=r(40000,1500000,1000),ctrT=r(5,25)/10,cl=Math.round(im*ctrT/100),cv=Math.max(3,Math.round(cl*r(8,40)/1000)),rv=Math.round(cv*r(30,180));
 const T=[["CPM","$",`Spend $${fmt(sp,0)}, Impressions ${fmt(im,0)}. CPM = ?`,sp/im*1000],["CTR","%",`Impressions ${fmt(im,0)}, Link clicks ${fmt(cl,0)}. CTR = ? (%)`,cl/im*100],["CPC","$",`Spend $${fmt(sp,0)}, Link clicks ${fmt(cl,0)}. CPC = ?`,sp/cl],["CR","%",`Link clicks ${fmt(cl,0)}, покупок ${cv}. CR = ? (%)`,cv/cl*100],["CPA","$",`Spend $${fmt(sp,0)}, покупок ${cv}. CPA = ?`,sp/cv],["ROAS","",`Spend $${fmt(sp,0)}, виручка $${fmt(rv,0)}. ROAS = ?`,rv/sp]];
 const t=T[Math.floor(Math.random()*T.length)];drill.q={name:t[0],unit:t[1],text:t[2],ans:t[3]};
}

/* ---------- status per page ---------- */
function status(id){
 if(doneMap()[id])return["Пройдено","green"];
 if(id==="plan"){const n=store.get("plan",[]).filter(Boolean).length;return n?[`${n}/${PLAN.length}`,"yellow"]:["Не почато","gray"]}
 if(id==="quiz"){const b=store.get("quizBest",null);return b!==null?[`Найкраще ${b}/${QUIZ.length}`,"yellow"]:["Не почато","gray"]}
 if(id==="cards"){const n=Object.values(store.get("known",{})).filter(Boolean).length;return n?[`Знаю ${n}/${GL.length}`,"yellow"]:["Не почато","gray"]}
 if(id==="drill"){const b=store.get("bestStreak",0);return b?[`Рекорд ${b}`,"yellow"]:["Не почато","gray"]}
 return["Не почато","gray"];
}

let qfSel=0,qfRes=[];

 GL.forEach((g,i)=>r.push({ic:"📖",t:`${g.t} — ${g.ua}`,sub:"Словник",txt:g.s,go:()=>{go("gloss");openPeek(i)}}));

  if(e.key==="Escape"){qfClose();return}
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!qfRes.length)return;qfSel=(qfSel+(e.key==="ArrowDown"?1:-1)+qfRes.length)%qfRes.length;qfRender();const s=$(`[data-qf="${qfSel}"]`);if(s)s.scrollIntoView({block:"nearest"});return}
  if(e.key==="Enter"){e.preventDefault();const x=qfRes[qfSel];if(x){qfClose();x.go()}return}
  return}
 if(e.key==="Escape"&&peekI!==null){closePeek();return}
 if(peekI!==null&&(e.key==="ArrowDown"||e.key==="ArrowUp")&&!e.target.closest("input")){e.preventDefault();stepPeek(e.key==="ArrowDown"?1:-1);return}
 if(e.target.id==="fc"&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.target.click();return}
 if(e.target.matches&&e.target.matches("tr.dbrow")&&e.key==="Enter"){openPeek(+e.target.dataset.term)}
});
document.addEventListener("change",e=>{
 const p=e.target.closest("[data-plan]");if(p){const d=store.get("plan",[]);d[+p.dataset.plan]=p.checked;store.set("plan",d);rerender();return}
 const a=e.target.closest("[data-ask]");if(a){const d=store.get("ask",[]);d[+a.dataset.ask]=a.checked;store.set("ask",d)}
});
document.addEventListener("input",e=>{
 if(e.target.id==="gl-search"){gl.q=e.target.value;fillGloss()}
 if(e.target.id==="qfIn"){qfSel=0;qfRender()}
 if(e.target.closest(".calc"))calc();
});
document.addEventListener("submit",e=>{
 if(e.target.id!=="drill-form")return;e.preventDefault();
 const v=parseFloat($("#drill-in").value.replace(/\s/g,"").replace(",",".").replace(/[$%]/g,""));
 const fb=()=>$("#drill-fb");
 if(!isFinite(v)){fb().textContent="Введіть число.";fb().className="fb no";return}
 const a=drill.q.ans,ok=Math.abs(v-a)<=Math.abs(a)*0.02+0.005;
 const shown=(drill.q.unit==="$"?"$":"")+fmt(a)+(drill.q.unit==="%"?"%":"");
 if(ok){drill.streak++;if(drill.streak>drill.best){drill.best=drill.streak;store.set("bestStreak",drill.best)}store.set("streak",drill.streak);genDrill();rerender();fb().textContent=`Правильно: ${shown}. Наступна задача вище.`;fb().className="fb ok";$("#drill-in").focus()}
 else{drill.streak=0;store.set("streak",0);fb().textContent=`Ні. Правильно: ${shown}. Натисніть «Інша задача».`;fb().className="fb no"}
});

/* ---------- boot ---------- */
applyTheme();
let start=(location.hash||"").slice(1);if(!P[start])start=store.get("tab","plan");if(!P[start])start="plan";
go(start,false);
</script>
</body>
</html>
